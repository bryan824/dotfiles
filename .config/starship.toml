"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](red)\
$os\
$username\
$hostname\
[](bg:peach fg:red)\
$directory\
[](bg:yellow fg:peach)\
$git_branch\
$git_commit\
$git_state\
${custom.git_email}\
$git_status\
[](fg:yellow bg:green)\
$rust\
$nodejs\
$python\
[](fg:green bg:sapphire)\
$conda\
$gcloud\
$kubernetes\
[](fg:sapphire bg:lavender)\
$time\
[ ](fg:lavender)\
$cmd_duration\
$line_break\
$jobs\
$character"""

palette = 'catppuccin_mocha'

[os]
disabled = false
style = "bg:red fg:crust"

[os.symbols]
Windows = ""
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "��"
Alpine = ""
Amazon = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "bg:red fg:crust"
style_root = "bg:red fg:crust"
format = '[ $user]($style)'

# Only over SSH (ssh_only is the default): on a VPS or the router the prompt
# says which box it is, and locally it stays out of the way.
[hostname]
style = "bg:red fg:crust"
format = '[@$hostname]($style)'

[directory]
style = "bg:peach fg:crust"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:yellow"
format = '[[ $symbol $branch ](fg:crust bg:yellow)]($style)'

# Detached HEAD only (only_detached is the default), when git_branch is empty.
[git_commit]
style = "bg:yellow"
format = '[[ $hash$tag ](fg:crust bg:yellow)]($style)'
tag_disabled = false
tag_symbol = " "

# REBASING 2/5, MERGING, CHERRY-PICKING, BISECTING -- pull.rebase is on, so a
# half-finished rebase is the state most worth seeing.
[git_state]
style = "bg:yellow"
format = '[[ $state( $progress_current/$progress_total) ](fg:crust bg:yellow)]($style)'

[custom.git_email]
command = "git config user.email"
when = true
require_repo = true
style = "bg:yellow"
format = "[[by $output ](fg:crust bg:yellow)]($style)"

[git_status]
style = "bg:yellow"
format = '[[($all_status$ahead_behind )](fg:crust bg:yellow)]($style)'

[nodejs]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'


[rust]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version) ](fg:crust bg:green)]($style)'






[python]
symbol = ""
style = "bg:green"
format = '[[ $symbol( $version)(\(#$virtualenv\)) ](fg:crust bg:green)]($style)'

[gcloud]
symbol = "󱇶 "
style = "bg:sapphire"
format = '[[ $symbol$account(@$domain)(\($project\)) ](fg:crust bg:sapphire)]($style)'
disabled = false


# Shows kubernetes context and namespace
[kubernetes]
symbol = "󱃾"
style = "bg:sapphire"
format = '[[ $symbol( $context)(\($namespace\)) ](fg:crust bg:sapphire)]($style)'
disabled = false

[conda]
symbol = "  "
style = "fg:crust bg:sapphire"
format = '[$symbol$environment ]($style)'
ignore_base = false

[time]
disabled = false
time_format = "%R"
style = "bg:lavender"
format = '[[  $time ](fg:crust bg:lavender)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'

[cmd_duration]
show_milliseconds = true
format = " in $duration "
style = "bg:lavender"
disabled = false

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
