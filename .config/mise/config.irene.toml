#: Irene's personal mac: env = ["desktop", "backup", "irene"].
#: Only what this machine adds on top of its layers.

[tools]
antigravity-cli = "latest"

# Same self-update agent bryan runs; the reasoning for its schedule is
# documented once, in config.bryan.toml.
[bootstrap.macos.launchd.agents.self-update]
program = "~/.local/bin/up.sh"
start_calendar_interval = { weekday = 0, hour = 4, minute = 0 }
stdout_path = "~/Library/Logs/up-launchagent.out"
stderr_path = "~/Library/Logs/up-launchagent.err"
