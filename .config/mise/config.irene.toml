#: Irene's personal mac. MISE_ENV=irene
#: Layers on top of config.toml.

[tools]
# desktop
bun = "latest"
node = "latest"
herdr = "latest"
opencode = "latest"
television = "latest"
rtk = "latest"
watchexec = "latest"

# backup + assistant
"github:kopia/kopia" = "latest"
rclone = "latest"
antigravity-cli = "latest"

# Machine class, readable by .tera templates. get_env("MISE_ENV") is NOT a
# substitute: mise resolves the class from ~/.config/mise/miserc.toml, so it
# loads this file even when MISE_ENV is absent from the environment, but a
# template reading the process environment then renders as if unclassed.
[vars]
class = "irene"
