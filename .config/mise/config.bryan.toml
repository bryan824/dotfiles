#: Bryan's personal mac. MISE_ENV=bryan
#: Layers on top of config.toml.

[tools]
# desktop
bun = "latest"
node = "latest"
herdr = "latest"
opencode = "latest"
television = "latest"
rtk = "latest"
watchexec = "latest"

# kubernetes / data
duckdb = "latest"
helm = "latest"
k9s = "latest"
kubectl = "latest"
kustomize = "latest"
prek = "latest"
tokei = "latest"

# personal-only
"npm:agent-browser" = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
claude-code = "latest"
antigravity-cli = "latest"
cilium-cli = "latest"
"github:kopia/kopia" = "latest"
# GnuPG is not in the mise registry and never will be: it is a source tarball
# against its own library chain, not a release binary any of the download
# backends can fetch. conda-forge ships a prebuilt one, hence the conda backend
# rather than a build from source.
#
# pinentry is a separate conda package -- conda:gnupg ships none, and without
# it every passphrase-protected secret-key operation dies with "No pinentry".
# gpg-agent resolves it by absolute path, not $PATH, so it needs the
# pinentry-program line in ~/.gnupg/gpg-agent.conf to find this one.
"conda:gnupg" = "latest"
"conda:pinentry" = "latest"
rclone = "latest"
stylua = "latest"
supabase = "latest"
talosctl = "latest"
yazi = "latest"

# ---------------------------------------------------------------------------
# LaunchAgents. Written to ~/Library/LaunchAgents/dev.mise.<name>.plist and
# loaded only by an explicit `mise bootstrap macos launchd-agents apply`.
#
# The agent inherits launchd's environment, not an interactive shell's, so the
# command activates mise by absolute path before calling anything from it.
# ---------------------------------------------------------------------------

# Nightly kopia snapshot of $HOME, then an index-vs-storage blob check.
# The work lives in the script so the pipeline inside it can run under
# pipefail; see .local/bin/kopia-nightly.sh.
[bootstrap.macos.launchd.agents.kopia-backup]
program = "~/.local/bin/kopia-nightly.sh"
start_calendar_interval = { hour = 2, minute = 0 }
stdout_path = "~/Library/Logs/kopia-launchagent.out"
stderr_path = "~/Library/Logs/kopia-launchagent.err"

# ipinfo.io API token, age-encrypted to ~/.config/mise/age.txt only.
# That key is not in this repo and is the only thing that opens this value.
[env]
IPINFO_TOKEN = { age = "" }
