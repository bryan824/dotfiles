#: Global mise config. Managed by this repo; symlinked to ~/.config/mise/config.toml.
#:
#: Every machine loads this file. What else it loads is set by MISE_ENV, which
#: is ALWAYS set, from ~/.config/mise/miserc.toml (machine-local, never
#: committed). Its value is a list of layers, each one a config.<layer>.toml
#: here, applied left to right:
#:
#:   desktop  macOS workstation: terminals, window managers, TUI/agent tools
#:   dev      kubernetes, data and project tooling
#:   backup   nightly kopia backup of $HOME
#:   bryan / irene   what one person's machine adds on top
#:   server / vyos   remote classes, reached by `mise bootstrap remote`
#:
#: Bryan's mac is  env = ["desktop", "dev", "backup", "bryan"].
#: A layer file holds its tools, dotfiles and LaunchAgents together.

[settings]
experimental = true
minimum_release_age = "0s"
dotfiles.default_mode = "symlink-each"

# Python is uv's job, not mise's: uv installs the interpreter, owns the lockfile
# and creates .venv. mise only activates that venv on cd, which is the whole of
# what direnv's layout_uv used to do. Requires a uv.lock for detection.
#
# No idiomatic_version_file_enable_tools here. Adding "python" to it made mise
# read .python-version as a version request and install a *second* interpreter
# beside uv's — see the two-installers rule in AGENTS.md. uv reads that file
# natively (`uv python pin` writes it), so the setting bought no pinning and
# only created orphan installs plus python/pip shims that error with
# "No version is set for shim".
python.uv_venv_auto = "source"

[settings.npm]
bun = true
package_manager = "bun"

# ---------------------------------------------------------------------------
# Dotfiles
#
# dotfiles.root defaults to ~/.dotfiles and sources mirror their target path,
# so a plain entry needs no `source`. Only templates (.tera) and copy-mode
# files spell it out.
#
# default_mode is symlink-each: the target stays a REAL directory with each
# file linked into it, so anything a tool writes at runtime lands there instead
# of in this repo. Two consequences:
#
#   - Single files must say mode = "symlink". symlink-each rejects a file
#     source outright ("requires the source to be a directory").
#   - A new file in the repo needs an apply before it shows up at the target.
#     ~/.config/television opts back into a whole-directory symlink for exactly
#     that reason, since cable channels get added often and nothing writes there.
#
# Entries here reach every machine. Anything narrower goes in the layer file
# that needs it (config.desktop.toml, ...), which only loads where miserc
# lists that layer -- no `variants` lists to keep in sync. Do not reintroduce
# them: an entry whose variants match two active layers is dropped with
# "ambiguous dotfile variants, ignoring entry".
# ---------------------------------------------------------------------------

[dotfiles]

# --- every machine -----------------------------------------------------------
"~/.zshenv" = { mode = "symlink" }
"~/.config/bat" = {}
"~/.config/ripgrep" = {}
"~/.config/rustfmt" = {}
"~/.config/git/ignore" = { mode = "symlink" }
"~/.config/starship.toml" = { mode = "symlink" }

# Body of the `up` function, and of the dev.mise.self-update LaunchAgent that
# bryan and irene declare. Every machine on purpose: the agent is macOS-only,
# but `up` is how a server updates itself by hand too.
"~/.local/bin/up.sh" = { mode = "symlink" }

# mise's own config, so this repo manages the file you are reading. One entry
# covers every config.<layer>.toml, and a new layer needs no table change.
# symlink-each leaves the unmanaged neighbours here alone: age.txt,
# config.local.toml and miserc.toml are machine-local and never tracked.
"~/.config/mise" = {}

# ---------------------------------------------------------------------------
# Templates (.tera)
# ---------------------------------------------------------------------------

[dotfiles."~/.config/git/config"]
source = "~/.dotfiles/.config/git/config.tera"
mode = "template"

[dotfiles."~/.config/zsh/80_host.zsh"]
source = "~/.dotfiles/.config/zsh/80_host.zsh.tera"
mode = "template"

# ---------------------------------------------------------------------------
# Directories holding a file their own tool rewrites at runtime.
# symlink-each links the rest; the self-writing file is copied so the tool's
# edits stay out of git until `dotfiles add --changed` pulls them in.
# ---------------------------------------------------------------------------

[dotfiles."~/.config/zsh"]
mode = "symlink-each"
exclude = ["80_host.zsh.tera"]

[dotfiles."~/.config/nvim"]
mode = "symlink-each"
exclude = ["nvim-pack-lock.json"]

[dotfiles."~/.config/nvim/nvim-pack-lock.json"]
mode = "copy"

# ---------------------------------------------------------------------------
# Tools every machine gets. Layer-specific tools live in config.<layer>.toml.
# ---------------------------------------------------------------------------

[tools]
age = "latest"
bat = "latest"
bottom = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
# Static binary, never imports project code, so one copy serves the editor LSP
# and any directory. Projects whose CI gates on lint pin their own via uv.
ruff = "latest"
starship = "latest"
usage = "latest"
uv = "latest"
zoxide = "latest"
