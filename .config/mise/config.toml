#: Global mise config. Managed by this repo; symlinked to ~/.config/mise/config.toml.
#:
#: Machine class is selected by MISE_ENV, which is ALWAYS set (never unset):
#:   bryan  - Bryan's personal mac      work   - Bryan's work mac
#:   irene  - Irene's personal mac      server - VPS / VM
#:
#: Per-class tools live in config.<class>.toml. Per-machine secrets and identity
#: live in ~/.config/mise/config.local.toml, which is NEVER committed.

[settings]
experimental = true
minimum_release_age = "0s"
dotfiles.default_mode = "symlink-each"

# Python is uv's job, not mise's: uv installs the interpreter, owns the lockfile
# and creates .venv. mise only activates that venv on cd, which is the whole of
# what direnv's layout_uv used to do. Requires a uv.lock for detection.
python.uv_venv_auto = "source"
idiomatic_version_file_enable_tools = ["python"]

[settings.npm]
bun = true
package_manager = "bun"

# ---------------------------------------------------------------------------
# Dotfiles
#
# dotfiles.root defaults to ~/.dotfiles and sources mirror their target path,
# so a plain entry needs no `source`. Only templates (.tera) and copy-mode
# files spell it out.
#
# default_mode is symlink-each: the target stays a REAL directory with each
# file linked into it, so anything a tool writes at runtime lands there instead
# of in this repo. Two consequences:
#
#   - Single files must say mode = "symlink". symlink-each rejects a file
#     source outright ("requires the source to be a directory").
#   - A new file in the repo needs an apply before it shows up at the target.
#     ~/.config/television opts back into a whole-directory symlink for exactly
#     that reason, since cable channels get added often and nothing writes there.
#
# An entry carrying only `variants` and no mode key is silently dropped with
# "no recognized operation", so those keep an explicit mode.
#
# `variants` filters inclusion by machine class. No variants = every machine.
# ---------------------------------------------------------------------------

[dotfiles]

# --- every machine -----------------------------------------------------------
"~/.zshenv" = { mode = "symlink" }
"~/.config/ripgrep" = {}
"~/.config/rustfmt" = {}
"~/.config/git/ignore" = { mode = "symlink" }

# Body of the `up` function, and of bryan's dev.mise.self-update LaunchAgent.
# No variants deliberately: the agent is macOS-only, but `up` is how every
# class including server updates itself by hand.
"~/.local/bin/up.sh" = { mode = "symlink" }

# mise's own config, so this repo manages the file you are reading. One entry
# covers every config.<class>.toml, and a new class needs no table change.
# symlink-each leaves the unmanaged neighbours here alone: age.txt,
# config.local.toml and miserc.toml are machine-local and never tracked.
"~/.config/mise" = {}

# --- desktops only (bryan / work / irene) ------------------------------------
"~/.config/ghostty" = { mode = "symlink-each", variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }] }
"~/.config/wezterm" = { mode = "symlink-each", variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }] }
"~/.config/aerospace" = { mode = "symlink-each", variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }] }
"~/.config/nehir" = { mode = "symlink-each", variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }] }
"~/.config/television" = { mode = "symlink", variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }] }

# --- bryan + work only -------------------------------------------------------
"~/.config/zellij" = { mode = "symlink-each", variants = [{ profile = "bryan" }, { profile = "work" }] }

# --- machines that run rclone / kopia backups (bryan / irene) -----------------
# Both files follow the tools they configure. A config whose audience drifts
# from its tool's is the bug that shipped twice here.
"~/.rclone_excludes.txt" = { mode = "symlink", variants = [{ profile = "bryan" }, { profile = "irene" }] }

# Kopia backup exclude list. Holds only exclude paths and no secrets.
# Deployed to the classes that install kopia.
"~/.kopiaignore" = { mode = "symlink", variants = [{ profile = "bryan" }, { profile = "irene" }] }

# Driver for the dev.mise.kopia-backup LaunchAgent, so it follows the agent
# rather than the tool: only bryan declares that agent.
"~/.local/bin/kopia-nightly.sh" = { mode = "symlink", variants = [{ profile = "bryan" }] }

# ---------------------------------------------------------------------------
# Templates (.tera)
# ---------------------------------------------------------------------------

[dotfiles."~/.config/git/config"]
source = "~/.dotfiles/.config/git/config.tera"
mode = "template"

[dotfiles."~/.config/starship.toml"]
source = "~/.dotfiles/.config/starship.toml.tera"
mode = "template"

[dotfiles."~/.config/zsh/80_host.zsh"]
source = "~/.dotfiles/.config/zsh/80_host.zsh.tera"
mode = "template"

[dotfiles."~/.claude/settings.json"]
source = "~/.dotfiles/.claude/settings.json.tera"
mode = "template"
variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }]

[dotfiles."~/.config/kitty/launch.conf"]
source = "~/.dotfiles/.config/kitty/launch.conf.tera"
mode = "template"
variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }]

# k9s rewrites config.yaml on exit (currentContext/currentCluster). Template
# mode renders one-way, so its runtime scribbles never reach this repo.
[dotfiles."~/.config/k9s/config.yaml"]
source = "~/.dotfiles/.config/k9s/config.yaml.tera"
mode = "template"
variants = [{ profile = "bryan" }, { profile = "work" }]

# ---------------------------------------------------------------------------
# Directories holding a file their own tool rewrites at runtime.
# symlink-each links the rest; the self-writing file is copied so the tool's
# edits stay out of git until `dotfiles add --changed` pulls them in.
# ---------------------------------------------------------------------------

[dotfiles."~/.config/zsh"]
mode = "symlink-each"
exclude = ["80_host.zsh.tera"]

[dotfiles."~/.config/nvim"]
mode = "symlink-each"
exclude = ["nvim-pack-lock.json"]

[dotfiles."~/.config/nvim/nvim-pack-lock.json"]
mode = "copy"

[dotfiles."~/.config/kitty"]
mode = "symlink-each"
exclude = ["launch.conf.tera", "current-theme.conf"]
variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }]

# Written by the kitty `themes` kitten.
[dotfiles."~/.config/kitty/current-theme.conf"]
mode = "copy"
variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }]

[dotfiles."~/.config/k9s"]
mode = "symlink-each"
exclude = ["config.yaml.tera"]
variants = [{ profile = "bryan" }, { profile = "work" }]

# herdr writes session.json, .plugins.lock and a socket next to its config.
# symlink-each keeps ~/.config/herdr a real directory, so those land there
# instead of in this repo.
[dotfiles."~/.config/herdr"]
mode = "symlink-each"
variants = [{ profile = "bryan" }, { profile = "work" }, { profile = "irene" }]

# ---------------------------------------------------------------------------
# Tools every machine gets. Class-specific tools live in config.<class>.toml.
# ---------------------------------------------------------------------------

[tools]
age = "latest"
bat = "latest"
bottom = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
neovim = "latest"
ripgrep = "latest"
# Static binary, never imports project code, so one copy serves the editor LSP
# and any directory. Projects whose CI gates on lint pin their own via uv.
ruff = "latest"
starship = "latest"
usage = "latest"
uv = "latest"
zoxide = "latest"
